name: University Notice Board CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  html-lint:
    name: HTML Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run HTMLHint on all HTML files
        run: npx htmlhint "src/**/*.html"

  css-lint:
    name: CSS Lint
    runs-on: ubuntu-latest
    needs: html-lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Stylelint
        run: npx stylelint "styles/style.css"

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: css-lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build website with Parcel
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t umairakhtar0/uni-notice-board:latest .

      - name: Push Docker image
        run: docker push umairakhtar0/uni-notice-board:latest
